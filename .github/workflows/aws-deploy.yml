name: Secure AWS Deployment

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::495013583310:role/GitHubDeploymentRole
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify assumed identity
        run: aws sts get-caller-identity

      - name: Deploy test resource
        run: |
          aws s3api list-buckets --query 'Buckets[].Name'
          echo "Secure OIDC deployment successful"